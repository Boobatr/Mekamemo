services:
  - type: web
    name: mekamemo-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run import:garages && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      # Free, key-less geocoding (OpenStreetMap) and real garages: the Canada-wide Overture
      # dataset in prisma/data is loaded into the database before each start (see DEPLOY.md).
      - key: OSM_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: NHTSA_VPIC_BASE_URL
        value: "https://vpic.nhtsa.dot.gov/api"
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Outgoing e-mail: password-reset codes and garage quote requests (see DEPLOY.md, section 8).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: EXPO_PUSH_ACCESS_TOKEN
        sync: false
      - key: EMAIL_INBOUND_WEBHOOK_SECRET
        sync: false
