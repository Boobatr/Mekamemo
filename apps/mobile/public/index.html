<!DOCTYPE html>
<!--
  Web page template (Expo fills in the language and the title below). Same as Expo's default, plus:
  the app translates itself (French / English), so browser auto-translation is switched off.
  Chrome and Safari "translate this page" rewrite the page's text nodes behind React's back,
  and React then fails with "NotFoundError: The object can not be found here." — a blank or broken screen.
-->
<html lang="%LANG_ISO_CODE%" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body translate="no" class="notranslate">
    <noscript>
      MekaMemo a besoin de JavaScript. / MekaMemo needs JavaScript to run.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
